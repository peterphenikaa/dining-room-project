services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:${DB_PORT}"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: dining_redis
    restart: always
    env_file:
      - .env
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data

  # Redpanda = Kafka API tương thích — nhẹ, dễ học local
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: dining_kafka
    restart: always
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --smp 1
      - --memory 512M
      - --mode dev-container
      - --default-log-level=warn
    ports:
      - "${KAFKA_HOST_PORT:-19092}:19092"
    volumes:
      - kafka_data:/var/lib/redpanda/data

  minio:
    image: minio/minio:latest
    container_name: dining_minio
    restart: always
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PUBLIC_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_HOST_PORT}:${MINIO_CONSOLE_PORT}"
    volumes:
      - minio_data:/data

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: auth_service
    restart: always
    command: ["npx", "nodemon", "--config", "nodemon.auth.json"]
    ports:
      - "${AUTH_HOST_PORT:-3003}:${AUTH_PORT:-3003}"
    env_file:
      - .env
      - .env.auth
    depends_on:
      - db
      - redis
      - kafka
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3003)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  kafka-consumer:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: kafka_auth_consumer
    restart: always
    command: ["npx", "nodemon", "--config", "nodemon.kafka.json"]
    env_file:
      - .env
    depends_on:
      - kafka
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

  app:
    build:
      context: .
      dockerfile: Dockerfile.dining
    container_name: express_app
    restart: always
    ports:
      - "${APP_HOST_PORT:-3002}:${PORT:-3002}"
    env_file:
      - .env
      - .env.dining
    depends_on:
      auth:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dining
    container_name: dining_worker
    restart: always
    command: ["npx", "nodemon", "--watch", "src", "--ext", "ts,json", "--exec", "npx tsc -p tsconfig.dining.json && node dist/worker.js", "--legacy-watch"]
    env_file:
      - .env
      - .env.dining
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

  phpmyadmin:
    image: phpmyadmin:5
    container_name: mysql_phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_HOST_PORT}:80"
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_PORT: ${DB_PORT}
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  db_data:
  redis_data:
  minio_data:
  kafka_data:
  app_node_modules:
